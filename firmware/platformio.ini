; One codebase, three board roles. Build/flash a role with:
;   pio run -e node1_mic     -t upload
;   pio run -e node2_buzzer  -t upload
;   pio run -e node3_display -t upload

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

[env:node1_mic]
build_flags =
    -DROLE_MIC
    -DNODE_ID=\"NODE-01\"
    -DSTATIC_IP_LAST_OCTET=203

[env:node2_buzzer]
build_flags =
    -DROLE_BUZZER
    -DNODE_ID=\"NODE-02\"
    -DSTATIC_IP_LAST_OCTET=202

[env:node3_display]
build_flags =
    -DROLE_DISPLAY
    -DNODE_ID=\"NODE-03\"
    -DSTATIC_IP_LAST_OCTET=201
